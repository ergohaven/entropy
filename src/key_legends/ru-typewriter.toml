# Physical positions and Base/Shift outputs from https://kbdlayout.info/kbdru1/
# Usage 32 is the ISO position sharing Windows scan code 2B with usage 31.
id = "ru-typewriter"
language = "Russian"
name = "Typewriter"

[keys]
"04" = { base = "ф", shift = "Ф" }
"05" = { base = "и", shift = "И" }
"06" = { base = "с", shift = "С" }
"07" = { base = "в", shift = "В" }
"08" = { base = "у", shift = "У" }
"09" = { base = "а", shift = "А" }
"0a" = { base = "п", shift = "П" }
"0b" = { base = "р", shift = "Р" }
"0c" = { base = "ш", shift = "Ш" }
"0d" = { base = "о", shift = "О" }
"0e" = { base = "л", shift = "Л" }
"0f" = { base = "д", shift = "Д" }
"10" = { base = "ь", shift = "Ь" }
"11" = { base = "т", shift = "Т" }
"12" = { base = "щ", shift = "Щ" }
"13" = { base = "з", shift = "З" }
"14" = { base = "й", shift = "Й" }
"15" = { base = "к", shift = "К" }
"16" = { base = "ы", shift = "Ы" }
"17" = { base = "е", shift = "Е" }
"18" = { base = "г", shift = "Г" }
"19" = { base = "м", shift = "М" }
"1a" = { base = "ц", shift = "Ц" }
"1b" = { base = "ч", shift = "Ч" }
"1c" = { base = "н", shift = "Н" }
"1d" = { base = "я", shift = "Я" }
"1e" = { base = "№", shift = "1" }
"1f" = { base = "-", shift = "2" }
"20" = { base = "/", shift = "3" }
"21" = { base = "\"", shift = "4" }
"22" = { base = ":", shift = "5" }
"23" = { base = ",", shift = "6" }
"24" = { base = ".", shift = "7" }
"25" = { base = "_", shift = "8" }
"26" = { base = "?", shift = "9" }
"27" = { base = "%", shift = "0" }
"2d" = { base = "!", shift = "=" }
"2e" = { base = ";", shift = "\\" }
"2f" = { base = "х", shift = "Х" }
