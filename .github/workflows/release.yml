name: Release

on:
  workflow_dispatch:
    inputs:
      prepare_release:
        description: 'Qualify one frozen release candidate on main (no publication)'
        required: true
        type: boolean
        default: false
      macos_signing_test:
        description: 'Validate pinned signing on the dedicated upstream branch (artifacts only)'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v0.*'

permissions:
  contents: read
  actions: read

concurrency:
  group: entropy-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve frozen release candidate
    if: ${{ github.repository == 'ergohaven/entropy' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.prepare_release == true)) }}
    runs-on: ubuntu-latest
    outputs:
      prepare: ${{ steps.plan.outputs.prepare }}
      tag: ${{ steps.plan.outputs.tag }}
      candidate_run_id: ${{ steps.plan.outputs.candidate_run_id }}
      candidate_artifact_id: ${{ steps.plan.outputs.candidate_artifact_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact source and an eligible candidate
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_candidate.py plan

  validate:
    name: Full release validation
    needs: plan
    if: needs.plan.outputs.prepare == 'true'
    uses: ./.github/workflows/release-validation.yml

  nix:
    name: Release Nix validation
    needs: plan
    if: needs.plan.outputs.prepare == 'true'
    uses: ./.github/workflows/nix.yml

  build:
    name: Sign qualified macOS (${{ matrix.arch }})
    needs: [plan, validate]
    if: needs.plan.outputs.prepare == 'true'
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
      ENTROPY_RELEASE_CANDIDATE: '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            kind: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-26-intel
            kind: macos
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the already qualified native app
        uses: actions/download-artifact@v8
        with:
          name: entropy-macos-${{ matrix.arch }}
          path: dist/qualified
      - name: Stage the exact qualified executable without recompilation
        run: python3 scripts/stage_macos_release_binary.py --source dist/qualified --target "${{ matrix.target }}"
      - name: Compile the certificate importer without signing credentials
        run: swiftc scripts/import_macos_certificate.swift -o "$RUNNER_TEMP/entropy-certificate-import"
      - name: Sign macOS app and build DMG
        if: matrix.kind == 'macos'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/sign_macos_release.sh

      - name: Verify signed release DMG and collect public evidence
        if: matrix.kind == 'macos'
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/collect_macos_signing_evidence.sh

      - name: Upload public release signing evidence only
        if: matrix.kind == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: release-signing-evidence-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/signing-test/signing-evidence.txt
            dist/signing-test/SHA256SUMS

      - name: Collect signed macOS DMG
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          mkdir -p dist/release
          asset="entropy-${RELEASE_TAG}-macos-${{ matrix.arch }}.dmg"
          cp dist/macos/*.dmg "dist/release/$asset"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: dist/release/*

  macos-signing-test:
    name: Signing test (${{ matrix.arch }})
    if: ${{ github.repository == 'ergohaven/entropy' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/macos-signing-validation-pr195' && inputs.macos_signing_test == true }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Intentionally no shared build cache in the credentialed validation job.
      - name: Test policy and compile without signing credentials
        env:
          TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          python3 scripts/test_macos_manual_workflow.py -v
          python3 scripts/test_macos_packaging.py -v
          bash scripts/test_macos_stable_signing.sh
          cargo build --locked --release --target "$TARGET"
          swiftc scripts/import_macos_certificate.swift -o "$RUNNER_TEMP/entropy-certificate-import"
          if "$RUNNER_TEMP/entropy-certificate-import" /nonexistent; then exit 1; fi

      - name: Sign prebuilt macOS app and create DMG
        shell: bash
        env:
          MACOS_SIGNING_TEST: '1'
          TARGET: ${{ matrix.target }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/sign_macos_release.sh

      - name: Verify DMG and collect public evidence without credentials
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/collect_macos_signing_evidence.sh

      - name: Upload signed test DMG and public evidence only
        uses: actions/upload-artifact@v7
        with:
          name: macos-signing-test-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/signing-test/*.dmg
            dist/signing-test/SHA256SUMS
            dist/signing-test/signing-evidence.txt

  candidate:
    name: Freeze qualified release candidate
    needs: [plan, build, validate, nix]
    if: needs.plan.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download qualified public binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: artifacts
      - name: Download full qualification proofs
        uses: actions/download-artifact@v8
        with:
          pattern: ci-proof-*
          path: proofs
      - name: Download public native signing proofs
        uses: actions/download-artifact@v8
        with:
          pattern: release-signing-evidence-*
          path: signing
      - name: Validate and freeze exact bytes with their source identity
        run: python3 scripts/release_candidate.py pack --assets artifacts --proofs proofs --signing signing --output dist/candidate --tag "$RELEASE_TAG"
      - name: Retain the verified candidate for promotion
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish verified candidate without rebuilding
    needs: plan
    if: ${{ github.repository == 'ergohaven/entropy' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.') }}
    permissions:
      contents: read
      actions: read
    concurrency:
      group: entropy-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the exact successful candidate by run and artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_candidate.py fetch --run-id "${{ needs.plan.outputs.candidate_run_id }}" --artifact-id "${{ needs.plan.outputs.candidate_artifact_id }}" --output "$RUNNER_TEMP/candidate"
      - name: Verify and stage the unchanged public file inventory
        run: python3 scripts/release_candidate.py stage --candidate "$RUNNER_TEMP/candidate" --output dist/release
      - name: Verify stored draft bytes, publish and read back public downloads
        env:
          GH_TOKEN: ${{ secrets.ERGOHAVEN_RELEASE_TOKEN }}
        run: python3 scripts/release_candidate.py publish --candidate "$RUNNER_TEMP/candidate"
