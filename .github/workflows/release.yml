name: Release

on:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: write

jobs:
  # Linux (deb/rpm/arch + AppImage) and Windows (portable exe + MSI) are built in
  # the pinned toolchain container, so CI runs the exact same path as local `task`.
  # Stable tags such as v0.1.2 publish as latest releases; suffix tags such as
  # v0.1.2-rc.1 publish as prereleases.
  linux:
    name: Linux + Windows packages
    if: ${{ startsWith(github.ref_name, 'v0.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux + Windows artifacts
        run: task docker:dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-windows
          path: dist/**/*

  # macOS artifacts are built natively on a Mac runner for real code signing and a
  # native .dmg. Both slices are built here and merged with lipo, so the release
  # ships a single universal .dmg instead of one download per architecture.
  macos:
    name: macOS (universal)
    if: ${{ startsWith(github.ref_name, 'v0.') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS .app + universal .dmg
        run: task macos:all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: dist/macos/*

  release:
    name: Create Release
    needs: [linux, macos]
    if: ${{ startsWith(github.ref_name, 'v0.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Write release notes
        shell: bash
        run: |
          awk -v version="${GITHUB_REF_NAME}" '
            /^## / {
              if (capturing) exit
              if ($2 == version) capturing = 1
            }
            capturing { print }
            END { if (!capturing) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md

          printf '\n## Downloads\n\n' >> RELEASE_NOTES.md
          printf '%s\n' '- Linux: install the `.deb`, `.rpm` or Arch `.pkg.tar.zst` for your distro, or download the `.AppImage`, make it executable, and run it.' >> RELEASE_NOTES.md
          printf '%s\n' '- Windows: run the `.msi` installer, or download and run the portable `.exe`.' >> RELEASE_NOTES.md
          printf '%s\n' '- macOS: download the universal `.dmg` (runs on both Apple Silicon and Intel), drag Entropy to Applications, then remove quarantine if macOS blocks the app.' >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Entropy ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
