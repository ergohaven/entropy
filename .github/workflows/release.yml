name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    # v1.13.x tags are internal build markers for downstream packagers.
    # Public GitHub releases use public version tags such as v1.14.3.
    if: ${{ !startsWith(github.ref_name, 'v1.13.') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-26-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Build
        if: matrix.os != 'macos-26-intel'
        run: cargo build --release

      - name: Package Linux artifact
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-x86_64.AppImage"
          cp target/release/entropy "dist/release/$asset"
          chmod +x "dist/release/$asset"

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-windows-x86_64.exe"
          cp target/release/entropy.exe "dist/release/$asset"

      - name: Build macOS app bundle and DMG
        if: matrix.os == 'macos-26-intel'
        shell: bash
        run: |
          scripts/build_macos_app.sh
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-macos-x86_64.dmg"
          cp dist/macos/*.dmg "dist/release/$asset"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: dist/release/*

  release:
    name: Create Release
    needs: build
    if: ${{ !startsWith(github.ref_name, 'v1.13.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## What's new

          - Added LED color settings for Bluetooth profiles 0-4 on supported RMK firmware.
          - Changed supported RMK LED timeout controls to use seconds instead of minutes.
          - Improved Universal Symbols on Windows so punctuation and symbols are typed instead of triggering app menus.
          - Documented Universal Symbols carrier keys so custom firmware authors avoid using F13-F24 for their own actions.

          ## Downloads

          - Linux: download the `.AppImage`, make it executable, and run it.
          - Windows: download and run the portable `.exe`.
          - macOS: download the unsigned `.dmg`, drag Entropy to Applications, then remove quarantine if macOS blocks the app.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Entropy ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
