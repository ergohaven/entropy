name: Release

on:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    # Stable tags such as v0.1.2 publish as latest releases.
    # Suffix tags such as v0.1.2-rc.1 publish as prereleases.
    if: ${{ startsWith(github.ref_name, 'v0.') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
          - os: windows-latest
            kind: windows
          - os: macos-26
            kind: macos
            arch: arm64
          - os: macos-26-intel
            kind: macos
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Build
        if: matrix.kind == 'windows'
        run: cargo build --release

      - name: Package Linux artifact
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          asset="entropy-${GITHUB_REF_NAME}-x86_64.AppImage"
          scripts/build_linux_appimage.sh "${GITHUB_REF_NAME}" "dist/release/$asset"

      - name: Package Windows artifact
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-windows-x86_64.exe"
          cp target/release/entropy.exe "dist/release/$asset"

      - name: Build macOS app bundle and DMG
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          scripts/build_macos_app.sh
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.dmg"
          cp dist/macos/*.dmg "dist/release/$asset"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: dist/release/*

  release:
    name: Create Release
    needs: build
    if: ${{ startsWith(github.ref_name, 'v0.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## What's new

          - Fixed Windows Universal Symbols modifier release.
          - Fixed the slash key picker label.
          - Fixed top tab overlap at scaled widths.
          - Fixed a macOS Apple Silicon release startup crash.
          - Added combo color highlights on the keyboard layout.
          - Matched the combo color picker to the Layer LED palette, including scroll.
          - Made new combo colors default to No color and migrated auto-assigned colors from the previous test build.
          - Aligned single combo outlines with the key border and made the outline heavier.
          - Kept circle markers only for keys with multiple colored combos.

          ## Downloads

          - Linux: download the `.AppImage`, make it executable, and run it.
          - Windows: download and run the portable `.exe`.
          - macOS: download the unsigned `.dmg` for your Mac (`arm64` for Apple Silicon, `x86_64` for Intel), drag Entropy to Applications, then remove quarantine if macOS blocks the app.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Entropy ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
