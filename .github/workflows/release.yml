name: Release

on:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    # Public GitHub releases use stable-style public tags such as v0.1.1.
    if: ${{ startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
          - os: windows-latest
            kind: windows
          - os: macos-26
            kind: macos
            arch: arm64
          - os: macos-26-intel
            kind: macos
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Build
        if: matrix.kind == 'windows'
        run: cargo build --release

      - name: Package Linux artifact
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          asset="entropy-${GITHUB_REF_NAME}-x86_64.AppImage"
          scripts/build_linux_appimage.sh "${GITHUB_REF_NAME}" "dist/release/$asset"

      - name: Package Windows artifact
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-windows-x86_64.exe"
          cp target/release/entropy.exe "dist/release/$asset"

      - name: Build macOS app bundle and DMG
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          scripts/build_macos_app.sh
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.dmg"
          cp dist/macos/*.dmg "dist/release/$asset"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: dist/release/*

  release:
    name: Create Release
    needs: build
    if: ${{ startsWith(github.ref_name, 'v0.') && !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## What's new

          - Fixed the Linux download so it is a real AppImage again and is back to the smaller expected size.
          - Added LED color settings for Bluetooth profiles 0-4 on supported RMK firmware.
          - Changed supported RMK LED timeout controls to use seconds instead of minutes.
          - Fixed macro handling for extended Vial macro keycodes.
          - Fixed a macOS startup crash related to device scanning.
          - Added the Debugger tool for easier troubleshooting and device inspection.
          - Improved Universal Symbols on Windows so punctuation and symbols are typed instead of triggering app menus.
          - Documented Universal Symbols carrier keys so custom firmware authors avoid using F13-F24 for their own actions.
          - Added macOS DMG downloads for Apple Silicon and Intel Macs.

          ## Downloads

          - Linux: download the `.AppImage`, make it executable, and run it.
          - Windows: download and run the portable `.exe`.
          - macOS: download the unsigned `.dmg` for your Mac (`arm64` for Apple Silicon, `x86_64` for Intel), drag Entropy to Applications, then remove quarantine if macOS blocks the app.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Entropy ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
