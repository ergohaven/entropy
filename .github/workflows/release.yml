name: Release

on:
  push:
    tags:
      - 'v0.*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    # Stable tags such as v0.1.2 publish as latest releases.
    # Suffix tags such as v0.1.2-rc.1 publish as prereleases.
    if: ${{ startsWith(github.ref_name, 'v0.') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
          - os: windows-latest
            kind: windows
          - os: macos-26
            kind: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-26-intel
            kind: macos
            arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install macOS Rust target
        if: matrix.kind == 'macos'
        run: rustup target add ${{ matrix.target }}

      - name: Import macOS Developer ID certificate
        if: matrix.kind == 'macos'
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          if [[ -z "$CERTIFICATE_P12_BASE64" ]] ||
            [[ -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "macOS Developer ID certificate secrets are not configured" >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/entropy-developer-id.p12"
          keychain_path="$RUNNER_TEMP/entropy-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$CERTIFICATE_P12_BASE64" |
            base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Build
        if: matrix.kind == 'windows'
        run: cargo build --release

      - name: Package Linux artifact
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          asset="entropy-${GITHUB_REF_NAME}-x86_64.AppImage"
          scripts/build_linux_appimage.sh "${GITHUB_REF_NAME}" "dist/release/$asset"

      - name: Package Windows artifact
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-windows-x86_64.exe"
          cp target/release/entropy.exe "dist/release/$asset"

      - name: Build macOS app bundle and DMG
        if: matrix.kind == 'macos'
        shell: bash
        env:
          CODESIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          REQUIRE_DISTRIBUTION_SIGNING: '1'
        run: |
          TARGET="${{ matrix.target }}" scripts/build_macos_app.sh

      - name: Notarize macOS DMG
        if: matrix.kind == 'macos'
        shell: bash
        env:
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          umask 077
          if [[ -z "$APPLE_NOTARY_KEY_P8_BASE64" ]]; then
            echo "Apple notarization key secret is not configured" >&2
            exit 1
          fi

          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" |
            base64 -D > "$notary_key_path"
          chmod 600 "$notary_key_path"

          dmg_paths=(dist/macos/*.dmg)
          if [[ ${#dmg_paths[@]} -ne 1 || ! -f "${dmg_paths[0]}" ]]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi

          APPLE_NOTARY_KEY_PATH="$notary_key_path" \
            scripts/notarize_macos_dmg.sh "${dmg_paths[0]}"
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.dmg"
          cp "${dmg_paths[0]}" "dist/release/$asset"

      - name: Remove macOS signing credentials
        if: matrix.kind == 'macos' && always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/entropy-signing.keychain-db"
          security delete-keychain "$keychain_path" || true
          rm -f \
            "$RUNNER_TEMP/entropy-developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: dist/release/*

  release:
    name: Create Release
    needs: build
    if: ${{ startsWith(github.ref_name, 'v0.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Write release notes
        shell: bash
        run: |
          awk -v version="${GITHUB_REF_NAME}" '
            /^## / {
              if (capturing) exit
              if ($2 == version) capturing = 1
            }
            capturing { print }
            END { if (!capturing) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md

          printf '\n## Downloads\n\n' >> RELEASE_NOTES.md
          printf '%s\n' '- Linux: download the `.AppImage`, make it executable, and run it.' >> RELEASE_NOTES.md
          printf '%s\n' '- Windows: download and run the portable `.exe`.' >> RELEASE_NOTES.md
          printf '%s\n' '- macOS: download the signed and notarized `.dmg` for your Mac (`arm64` for Apple Silicon, `x86_64` for Intel), then drag Entropy to Applications.' >> RELEASE_NOTES.md
          printf '%s\n' '- When upgrading from Entropy v0.2.0 or earlier, remove old Entropy entries from Accessibility and Input Monitoring, then grant both permissions once for the signed app. Later signed updates preserve this identity.' >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Entropy ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
