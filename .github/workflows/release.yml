name: Release

on:
  # Registered on main; a maintainer copies the reviewed SHA to the exact test
  # branch before dispatch. No input can select arbitrary source with secrets.
  workflow_dispatch:
    inputs:
      macos_signing_test:
        description: 'Validate pinned signing on the dedicated upstream branch (artifacts only)'
        required: true
        type: boolean
        default: false
  push:
    tags:
      - 'v0.*'

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    # Stable tags such as v0.1.2 publish as latest releases.
    # Suffix tags such as v0.1.2-rc.1 publish as prereleases.
    if: ${{ github.repository == 'ergohaven/entropy' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
          - os: windows-latest
            kind: windows
          - os: macos-26
            kind: macos
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-26-intel
            kind: macos
            arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install macOS Rust target
        if: matrix.kind == 'macos'
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Build
        if: matrix.kind == 'windows'
        run: cargo build --release

      - name: Package Linux artifact
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          asset="entropy-${GITHUB_REF_NAME}-x86_64.AppImage"
          scripts/build_linux_appimage.sh "${GITHUB_REF_NAME}" "dist/release/$asset"

      - name: Package Windows artifact
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-windows-x86_64.exe"
          cp target/release/entropy.exe "dist/release/$asset"

      # Neither Cargo nor swiftc runs with signing credentials in its environment.
      - name: Build macOS binary and certificate importer
        if: matrix.kind == 'macos'
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          cargo build --locked --release --target "${{ matrix.target }}"
          swiftc scripts/import_macos_certificate.swift -o "$RUNNER_TEMP/entropy-certificate-import"

      - name: Sign macOS app and build DMG
        if: matrix.kind == 'macos'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/sign_macos_release.sh

      - name: Verify signed release DMG and collect public evidence
        if: matrix.kind == 'macos'
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/collect_macos_signing_evidence.sh

      - name: Upload public release signing evidence only
        if: matrix.kind == 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: release-signing-evidence-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/signing-test/signing-evidence.txt
            dist/signing-test/SHA256SUMS

      - name: Collect signed macOS DMG
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          mkdir -p dist/release
          asset="entropy-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.dmg"
          cp dist/macos/*.dmg "dist/release/$asset"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.os }}
          path: dist/release/*

  macos-signing-test:
    name: Signing test (${{ matrix.arch }})
    if: ${{ github.repository == 'ergohaven/entropy' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/ci/macos-signing-validation-pr195' && inputs.macos_signing_test == true }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Intentionally no shared build cache in the credentialed validation job.
      - name: Test policy and compile without signing credentials
        env:
          TARGET: ${{ matrix.target }}
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          python3 scripts/test_macos_manual_workflow.py -v
          python3 scripts/test_macos_packaging.py -v
          bash scripts/test_macos_stable_signing.sh
          cargo build --locked --release --target "$TARGET"
          swiftc scripts/import_macos_certificate.swift -o "$RUNNER_TEMP/entropy-certificate-import"
          if "$RUNNER_TEMP/entropy-certificate-import" /nonexistent; then exit 1; fi

      - name: Sign prebuilt macOS app and create DMG
        shell: bash
        env:
          MACOS_SIGNING_TEST: '1'
          TARGET: ${{ matrix.target }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/sign_macos_release.sh

      - name: Verify DMG and collect public evidence without credentials
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/collect_macos_signing_evidence.sh

      - name: Upload signed test DMG and public evidence only
        uses: actions/upload-artifact@v7
        with:
          name: macos-signing-test-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/signing-test/*.dmg
            dist/signing-test/SHA256SUMS
            dist/signing-test/signing-evidence.txt

  release:
    name: Create Release
    needs: build
    if: ${{ github.repository == 'ergohaven/entropy' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v0.') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: artifacts/

      - name: Write release notes
        shell: bash
        run: |
          awk -v version="${GITHUB_REF_NAME}" '
            /^## / {
              if (capturing) exit
              if ($2 == version) capturing = 1
            }
            capturing { print }
            END { if (!capturing) exit 1 }
          ' CHANGELOG.md > RELEASE_NOTES.md

          # Markdown backticks are literal installation text, not shell commands.
          # shellcheck disable=SC2016
          {
            printf '\n## Downloads\n\n'
            printf '%s\n' '- Linux: download the `.AppImage`, make it executable, and run it.'
            printf '%s\n' '- Windows: download and run the portable `.exe`.'
            printf '%s\n' '- macOS: download the `.dmg` for your Mac (`arm64` for Apple Silicon, `x86_64` for Intel). See README for installation and Open Anyway instructions (self-signed, not notarized).'
          } >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Entropy ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body_path: RELEASE_NOTES.md
          files: artifacts/**/*
