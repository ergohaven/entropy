name: Nix

# The Build workflow compiles with cargo and apt dependencies, which says
# nothing about whether the flake still evaluates or builds. This one covers
# the Nix side: both packages, both module evaluations, and every declared
# system's flake outputs.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, rynk]
  push:
    branches: [main]

concurrency:
  group: nix-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Select Nix coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.policy.outputs.run }}
      reason: ${{ steps.policy.outputs.reason }}
      source_run: ${{ steps.policy.outputs.source_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI selection and workflow contracts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select new validation or verified reuse
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_policy.py plan --profile nix

  flake:
    name: Flake (${{ matrix.system }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        if: matrix.system == 'x86_64-linux'
        run: nix fmt -- --ci

      # Cheap and the most likely thing to break: option collisions with the
      # Entropy module in nixpkgs, or the module quietly claiming the system
      # input method again.
      - name: Evaluate modules
        run: |
          nix build --print-build-logs --out-link result-nixos-module .#checks.${{ matrix.system }}.module-eval
          nix build --print-build-logs --out-link result-home-manager-module .#checks.${{ matrix.system }}.home-manager-module-eval

      - name: Build packages
        run: |
          nix build --print-build-logs --out-link result-entropy .#packages.${{ matrix.system }}.entropy
          nix build --print-build-logs --out-link result-engine .#packages.${{ matrix.system }}.entropy-ibus-engine

      - name: Check the IBus engine dependencies
        run: ./result-engine/libexec/entropy-ibus-engine --entropy-check

      - name: Flake check
        run: nix flake check --print-build-logs

  complete:
    name: Nix validation result
    needs: [plan, flake]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected coverage to complete
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FULL_VALIDATION: ${{ needs.plan.outputs.run }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          if needs['plan']['result'] != 'success':
              raise SystemExit('Nix coverage selection failed')
          mode = os.environ['FULL_VALIDATION']
          if mode not in ('true', 'false'):
              raise SystemExit('Missing explicit validation decision')
          expected = 'success' if mode == 'true' else 'skipped'
          if needs['flake']['result'] != expected:
              raise SystemExit(f'flake: expected {expected}, got {needs["flake"]["result"]}')
          PY
      - uses: actions/checkout@v7
        if: needs.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - name: Record actual full Nix validation
        if: needs.plan.outputs.run == 'true'
        run: python3 .github/scripts/ci_policy.py record --profile nix --output "$RUNNER_TEMP/ci-proof/nix.json"
      - name: Publish Nix validation proof
        if: needs.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-proof-nix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof/nix.json
          if-no-files-found: error
