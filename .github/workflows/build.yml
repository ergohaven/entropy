name: Native profile diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entropy-native-profile-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: macOS ARM64 profile diagnostics
    if: github.repository == 'ergohaven/entropy' && github.ref == 'refs/heads/ci/entropy-macos-profile-diagnostics'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact diagnostic source before compilation
        run: python3 .github/scripts/native_profile_diagnostic.py preflight
      - name: Test diagnostic scope and evidence parser
        run: python3 .github/scripts/native_profile_diagnostic.py self-test
      - name: Install historical Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.1'
          targets: aarch64-apple-darwin
      - name: Cache matching native dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-profile-diagnostic-1.100.1
          cache-on-failure: true
      - name: Install historical native test runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150
      - name: Compile and freeze native binaries outside execution deadline
        run: python3 .github/scripts/native_profile_diagnostic.py prepare
      - name: Run original parallel native suite with opt-in representative traces
        run: python3 .github/scripts/native_profile_diagnostic.py run
      - name: Preserve diagnostic evidence even on test failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-profile-diagnostic-arm64
          path: dist/native-profile-diagnostic/
          if-no-files-found: error
          retention-days: 14
