name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, rynk]

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Select Build coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      run: ${{ steps.policy.outputs.run }}
      reason: ${{ steps.policy.outputs.reason }}
      source_run: ${{ steps.policy.outputs.source_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test CI selection and workflow contracts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select new validation or verified reuse
        id: policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/ci_policy.py plan --profile build

  build:
    name: Build (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            artifact: entropy-linux
            binary: target/release/entropy
          - os: windows-latest
            kind: windows
            artifact: entropy-windows
            binary: target/release/entropy.exe
          - os: macos-15
            kind: macos
            artifact: entropy-macos-arm64
            binary: dist/macos/*.app.zip
            target: aarch64-apple-darwin
          - os: macos-15-intel
            kind: macos
            artifact: entropy-macos-x86_64
            binary: dist/macos/*.app.zip
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install macOS Rust target
        if: matrix.kind == 'macos'
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Test AppImage tool integrity verification
        if: matrix.kind == 'linux'
        run: |
          bash scripts/test_verify_sha256.sh
          bash scripts/test_build_linux_appimage.sh
          bash scripts/test_update_appimagetool_pin.sh

      - name: Build
        if: matrix.kind != 'macos'
        run: cargo build --release

      - name: Test macOS packaging and signing policy (no credentials)
        if: matrix.kind == 'macos'
        run: |
          python3 scripts/test_macos_manual_workflow.py -v
          python3 scripts/test_macos_packaging.py -v
          bash scripts/test_macos_stable_signing.sh
          swiftc scripts/import_macos_certificate.swift -o "$RUNNER_TEMP/entropy-certificate-import"
          # Missing credentials must fail without creating or changing any keychain.
          if "$RUNNER_TEMP/entropy-certificate-import" /nonexistent; then exit 1; fi

      - name: Build macOS app bundle
        if: matrix.kind == 'macos'
        run: TARGET="${{ matrix.target }}" scripts/build_macos_app.sh

      - name: Verify mounted macOS DMG
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          dmgs=(dist/macos/*.dmg)
          ENTROPY_TEST_DMG="${dmgs[0]}" python3 scripts/test_macos_packaging.py NativeDMG -v

      - name: Test
        if: matrix.kind == 'linux'
        run: cargo test --all-targets

      - name: Install go-task
        if: matrix.kind == 'linux'
        uses: arduino/setup-task@v2
        with:
          version: 3.44.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Путь разработчика: `task linux:all` на голом хосте. Публикуемые пакеты
      # приезжают не отсюда, а из контейнера с пиннутым тулчейном — здесь
      # проверяется только то, что локальная сборка вообще работает.
      - name: Build Linux packages on the host
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get install -y --no-install-recommends libarchive-tools desktop-file-utils
          scripts/prepare_env.sh --tools-only
          scripts/test_toolchain_pins.sh
          scripts/test_pkg_version.sh
          task linux:all
          scripts/test_linux_packages.sh
          desktop-file-validate packaging/linux/entropy.desktop

      - name: Test layout indicator window policy
        if: matrix.kind != 'linux'
        run: cargo test --all-targets app::layout_indicator_window::tests

      - name: Test macOS HID workers
        if: matrix.kind == 'macos'
        run: |
          cargo test --all-targets hid::tests::test_hid_skips_macos_operation_lock -- --exact
          cargo test --all-targets hid::tests::stale_input_monitoring_preflight_does_not_block_bluetooth_hid_open -- --exact
          cargo test --all-targets hid::tests::input_monitoring_request_only_runs_for_ungranted_bluetooth -- --exact
          cargo test --all-targets hid::tests::input_monitoring_denial_is_a_terminal_hid_open_error -- --exact
          cargo test --all-targets app::app_lifecycle::tests::combo_completion_starts_settings_queued_behind_it -- --exact
          cargo test --all-targets app::vial_hid_task::tests::macro_write_uses_the_serialized_background_transport -- --exact
          cargo test --all-targets app::app_lifecycle::tests::layer_completion_starts_settings_queued_behind_it -- --exact

      - name: Test macOS Text Expander discovery and callbacks
        if: matrix.kind == 'macos'
        run: |
          cargo test --all-targets smart_input::tests::macos_ -- --test-threads=1 --nocapture

      - name: Test native HID ownership and shared host output
        if: matrix.kind != 'linux'
        run: |
          cargo test --all-targets hid::hid_proxy::tests -- --test-threads=1
          cargo test --all-targets qmk_hid_host::qa_followup_shared_output -- --test-threads=1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # Канонические Linux-артефакты: только контейнер с пиннутыми базовым образом,
  # слепком архива Debian и версиями nfpm/appimagetool. У хост-джобы Rust
  # плавающий (stable), и её пакеты поэтому никуда не публикуются.
  container:
    name: Build (toolchain container)
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SOURCE_DATE_EPOCH берётся из времени коммита, а без истории его нет.
          fetch-depth: 0

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.44.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Собирает дважды из одного дерева и сравнивает суммы: без этого
      # «воспроизводимо» остаётся утверждением, которое никто не проверял.
      - name: Build Linux artifacts twice in the container
        run: task docker:repro

      - name: Take the verified build as the canonical artifacts
        run: |
          mkdir -p dist/linux
          cp target/repro/a/linux/* dist/linux/

      - name: Verify package contents
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools
          scripts/test_linux_packages.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: entropy-linux-packages
          path: dist/linux/*
          if-no-files-found: error

  # Установка, а не распаковка: только она проверяет, что выписанные руками
  # зависимости существуют в репозиториях, разрешаются и что приложение с ними
  # стартует. Три чистых образа вместо хоста, где всё нужное уже стоит как
  # build-зависимость.
  packages:
    name: Install packages (clean distros)
    runs-on: ubuntu-latest
    needs: [plan, container]
    if: needs.plan.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Download the container-built packages
        uses: actions/download-artifact@v8
        with:
          name: entropy-linux-packages
          path: dist/linux

      - name: Clean-install on Debian, Fedora and Arch
        run: scripts/test_linux_install.sh

  complete:
    name: Build validation result
    needs: [plan, build, container, packages]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected coverage to complete
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          FULL_VALIDATION: ${{ needs.plan.outputs.run }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS_JSON'])
          if needs['plan']['result'] != 'success':
              raise SystemExit('Build coverage selection failed')
          mode = os.environ['FULL_VALIDATION']
          if mode not in ('true', 'false'):
              raise SystemExit('Missing explicit validation decision')
          expected = 'success' if mode == 'true' else 'skipped'
          for name in ('build', 'container', 'packages'):
              if needs[name]['result'] != expected:
                  raise SystemExit(f'{name}: expected {expected}, got {needs[name]["result"]}')
          PY
      - uses: actions/checkout@v7
        if: needs.plan.outputs.run == 'true'
        with:
          persist-credentials: false
      - name: Record actual full Build validation
        if: needs.plan.outputs.run == 'true'
        run: python3 .github/scripts/ci_policy.py record --profile build --output "$RUNNER_TEMP/ci-proof/build.json"
      - name: Publish Build validation proof
        if: needs.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ci-proof-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-proof/build.json
          if-no-files-found: error
