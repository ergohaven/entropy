name: Build

on:
  workflow_dispatch:  # manual only — disabled automatic build
  push:
    branches: [disabled-auto-build]
  pull_request:
    branches: [main]

# Новый пуш в PR отменяет прогон предыдущего: держать очередь из устаревших
# сборок незачем. Для релизов наоборот — там отмена запрещена.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            artifact: entropy-linux
            binary: target/release/entropy
          - os: windows-latest
            kind: windows
            artifact: entropy-windows
            binary: target/release/entropy.exe
          # Тот же универсальный путь, что и в релизе: раньше гейт собирал по
          # одной арке на раннер, и ветка с lipo и слиянием слайсов впервые
          # исполнялась уже на теге.
          - os: macos-15
            kind: macos
            artifact: entropy-macos-universal
            binary: dist/macos/*.dmg
            targets: aarch64-apple-darwin x86_64-apple-darwin

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Гейт проверяет ту же версию Rust, которой собирается релиз: иначе
      # «зелёный PR» ничего не говорит о том, соберётся ли тег.
      - name: Read the pinned Rust version
        id: rust
        shell: bash
        run: echo "version=$(awk '/^rust / { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch @ 2026-08
        with:
          toolchain: ${{ steps.rust.outputs.version }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2.9.1

      - name: Install macOS Rust targets
        if: matrix.kind == 'macos'
        run: rustup target add ${{ matrix.targets }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Test AppImage tool integrity verification
        if: matrix.kind == 'linux'
        run: |
          bash scripts/test_verify_sha256.sh
          bash scripts/test_build_linux_appimage.sh
          bash scripts/test_update_appimagetool_pin.sh

      - name: Build
        if: matrix.kind != 'macos'
        run: cargo build --release

      - name: Build macOS app bundle
        if: matrix.kind == 'macos'
        run: TARGETS="${{ matrix.targets }}" scripts/build_macos_app.sh

      # build_macos_app.sh уже сверяет слайсы, но проверка повторена на готовом
      # бандле: она ловит и случай, когда .app собрали не тем бинарником.
      - name: Check the bundle is universal
        if: matrix.kind == 'macos'
        run: |
          archs="$(lipo -archs dist/macos/Entropy.app/Contents/MacOS/entropy)"
          echo "architectures: $archs"
          for expected in arm64 x86_64; do
            case " $archs " in
            *" $expected "*) ;;
            *) echo "::error::the bundle is missing the $expected slice"; exit 1 ;;
            esac
          done

      - name: Test
        if: matrix.kind == 'linux'
        run: cargo test --all-targets

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
