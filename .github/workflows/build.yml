name: Build

on:
  workflow_dispatch:  # manual only — disabled automatic build
  push:
    branches: [disabled-auto-build]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            artifact: entropy-linux
            binary: target/release/entropy
          - os: windows-latest
            kind: windows
            artifact: entropy-windows
            binary: target/release/entropy.exe
          - os: macos-15
            kind: macos
            artifact: entropy-macos-arm64
            binary: dist/macos/*.app.zip
            target: aarch64-apple-darwin
          - os: macos-15-intel
            kind: macos
            artifact: entropy-macos-x86_64
            binary: dist/macos/*.app.zip
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install macOS Rust target
        if: matrix.kind == 'macos'
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Test AppImage tool integrity verification
        if: matrix.kind == 'linux'
        run: |
          bash scripts/test_verify_sha256.sh
          bash scripts/test_build_linux_appimage.sh
          bash scripts/test_update_appimagetool_pin.sh

      - name: Build
        if: matrix.kind != 'macos'
        run: cargo build --release

      - name: Build macOS app bundle
        if: matrix.kind == 'macos'
        run: TARGET="${{ matrix.target }}" scripts/build_macos_app.sh

      - name: Test
        if: matrix.kind == 'linux'
        run: cargo test --all-targets

      - name: Install go-task
        if: matrix.kind == 'linux'
        uses: arduino/setup-task@v2
        with:
          version: 3.44.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Путь разработчика: `task linux:all` на голом хосте. Публикуемые пакеты
      # приезжают не отсюда, а из контейнера с пиннутым тулчейном — здесь
      # проверяется только то, что локальная сборка вообще работает.
      - name: Build Linux packages on the host
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get install -y --no-install-recommends libarchive-tools desktop-file-utils
          scripts/prepare_env.sh --tools-only
          scripts/test_toolchain_pins.sh
          scripts/test_pkg_version.sh
          task linux:all
          scripts/test_linux_packages.sh
          desktop-file-validate packaging/linux/entropy.desktop

      - name: Test layout indicator window policy
        if: matrix.kind != 'linux'
        run: cargo test --all-targets app::layout_indicator_window::tests

      - name: Test macOS HID workers
        if: matrix.kind == 'macos'
        run: |
          cargo test --all-targets hid::tests::test_hid_skips_macos_operation_lock -- --exact
          cargo test --all-targets app::app_lifecycle::tests::combo_completion_starts_settings_queued_behind_it -- --exact
          cargo test --all-targets app::vial_hid_task::tests::macro_write_uses_the_serialized_background_transport -- --exact
          cargo test --all-targets app::app_lifecycle::tests::layer_completion_starts_settings_queued_behind_it -- --exact

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  # Канонические Linux-артефакты: только контейнер с пиннутыми базовым образом,
  # слепком архива Debian и версиями nfpm/appimagetool. У хост-джобы Rust
  # плавающий (stable), и её пакеты поэтому никуда не публикуются.
  container:
    name: Build (toolchain container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SOURCE_DATE_EPOCH берётся из времени коммита, а без истории его нет.
          fetch-depth: 0

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.44.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Собирает дважды из одного дерева и сравнивает суммы: без этого
      # «воспроизводимо» остаётся утверждением, которое никто не проверял.
      - name: Build Linux artifacts twice in the container
        run: task docker:repro

      - name: Take the verified build as the canonical artifacts
        run: |
          mkdir -p dist/linux
          cp target/repro/a/linux/* dist/linux/

      - name: Verify package contents
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools
          scripts/test_linux_packages.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: entropy-linux-packages
          path: dist/linux/*
          if-no-files-found: error

  # Установка, а не распаковка: только она проверяет, что выписанные руками
  # зависимости существуют в репозиториях, разрешаются и что приложение с ними
  # стартует. Три чистых образа вместо хоста, где всё нужное уже стоит как
  # build-зависимость.
  packages:
    name: Install packages (clean distros)
    runs-on: ubuntu-latest
    needs: container
    steps:
      - uses: actions/checkout@v7

      - name: Download the container-built packages
        uses: actions/download-artifact@v8
        with:
          name: entropy-linux-packages
          path: dist/linux

      - name: Clean-install on Debian, Fedora and Arch
        run: scripts/test_linux_install.sh
