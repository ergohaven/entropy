name: macOS bounded diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Diagnostic (${{ matrix.arch }})
    if: github.ref == 'refs/heads/ci/macos-diagnostic-2f875db-20261114'
    runs-on: ${{ matrix.os }}
    env:
      EXPECTED_ARCH: ${{ matrix.arch }}
      EXPECTED_RUNNER: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - os: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
          persist-credentials: false
      - name: Verify pinned source before installing or compiling
        run: python3 scripts/macos_bounded_diagnostic.py --preflight
      - name: Check diagnostic controller contracts
        run: python3 scripts/test_macos_bounded_diagnostic.py -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.150
      - name: Prepare native test executable (not runtime budget)
        shell: bash
        run: |
          mkdir -p diagnostic-evidence
          rustc -Vv > diagnostic-evidence/rustc.txt
          cargo nextest --version > diagnostic-evidence/nextest.txt
          sw_vers > diagnostic-evidence/os.txt
          uname -m > diagnostic-evidence/arch.txt
          cargo nextest list --locked --all-targets --list-type binaries-only --message-format json > diagnostic-evidence/binaries-metadata.json
          cargo metadata --locked --format-version 1 --filter-platform '${{ matrix.target }}' > diagnostic-evidence/cargo-metadata.json
      - name: Run exact cases and capture native stacks
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_RUNNER: ${{ matrix.os }}
          ENTROPY_MACOS_DIAGNOSTIC: '1'
          RUST_BACKTRACE: full
        run: python3 scripts/macos_bounded_diagnostic.py
      - name: Retain diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-diagnostic-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
