name: Build

on:
  workflow_dispatch:  # manual only — disabled automatic build
  push:
    branches: [disabled-auto-build]
  pull_request:
    branches: [main]

# Новый пуш в PR отменяет прогон предыдущего: держать очередь из устаревших
# сборок незачем. Для релизов наоборот — там отмена запрещена.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            artifact: entropy-linux
            binary: target/release/entropy
          - os: windows-latest
            kind: windows
            artifact: entropy-windows
            binary: target/release/entropy.exe
          - os: macos-15
            kind: macos
            artifact: entropy-macos-universal
            binary: dist/macos/*.dmg

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install macOS Rust targets
        if: matrix.kind == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Build
        if: matrix.kind != 'macos'
        run: cargo build --release

      - name: Build macOS app bundle
        if: matrix.kind == 'macos'
        run: scripts/build_macos_app.sh

      - name: Test
        if: matrix.kind == 'linux'
        run: cargo test --all-targets

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
