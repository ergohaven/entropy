name: Build

on:
  workflow_dispatch:  # manual only — disabled automatic build
  push:
    branches: [disabled-auto-build]
  pull_request:
    branches: [main]

jobs:
  fcitx5-addon:
    name: Build Fcitx5 addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Fcitx5 development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ extra-cmake-modules libfcitx5core-dev

      - name: Configure and build addon
        run: |
          cmake -S linux/fcitx5 -B build/fcitx5 -DCMAKE_BUILD_TYPE=Release
          cmake --build build/fcitx5 --parallel
          ctest --test-dir build/fcitx5 --output-on-failure

  ibus-backend:
    name: Test IBus backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install IBus dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-ibus-1.0

      - name: Run host-text transport behavior tests
        run: python3 linux/ibus/entropy-ibus-engine --entropy-transport-test

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            artifact: entropy-linux
            binary: target/release/entropy
          - os: windows-latest
            kind: windows
            artifact: entropy-windows
            binary: target/release/entropy.exe
          - os: macos-15
            kind: macos
            artifact: entropy-macos-arm64
            binary: dist/macos/*.app.zip
            target: aarch64-apple-darwin
          - os: macos-15-intel
            kind: macos
            artifact: entropy-macos-x86_64
            binary: dist/macos/*.app.zip
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install macOS Rust target
        if: matrix.kind == 'macos'
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhidapi-dev \
            libudev-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Build
        if: matrix.kind != 'macos'
        run: cargo build --release

      - name: Build macOS app bundle
        if: matrix.kind == 'macos'
        run: TARGET="${{ matrix.target }}" scripts/build_macos_app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
