name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, rynk]

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Workflow contracts
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  build:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: linux
            artifact: entropy-linux
            binary: dist/test/*.AppImage
          - os: windows-latest
            kind: windows
            artifact: entropy-windows
            binary: target/release/entropy.exe
          - os: macos-15
            kind: macos
            artifact: entropy-macos-arm64
            binary: dist/macos/*.app.zip
            target: aarch64-apple-darwin
          - os: macos-15-intel
            kind: macos
            artifact: entropy-macos-x86_64
            binary: dist/macos/*.app.zip
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install macOS Rust target
        if: matrix.kind == 'macos'
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.kind == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libhidapi-dev libudev-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Build Linux AppImage
        if: matrix.kind == 'linux'
        run: scripts/build_linux_appimage.sh "test-${GITHUB_SHA:0:8}" "dist/test/entropy-test-${GITHUB_SHA:0:8}-x86_64.AppImage"

      - name: Build Windows executable
        if: matrix.kind == 'windows'
        run: cargo build --release --locked --bin entropy

      - name: Build macOS app bundle
        if: matrix.kind == 'macos'
        run: TARGET="${{ matrix.target }}" scripts/build_macos_app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14
