# https://taskfile.dev
#
# Cross-platform build & packaging for Entropy.
#
# Two strategies, split by task namespace:
#   native  — build/package for the CURRENT host OS (best quality: real signing,
#             native .dmg). Entry points: `task build`, `task package`.
#   docker  — reproducible cross-build of Linux + Windows from a Linux container,
#             runnable from any host with Docker. Entry point: `task docker:dist`.
#
# What each host can produce (see README for the full matrix):
#   Linux   : deb/rpm/arch, AppImage, Windows exe+MSI, universal macOS .app/.dmg
#   macOS   : macOS .app/.dmg natively; Linux/Windows only via Docker
#   Windows : native exe; everything else via Docker
version: '3'

vars:
  APP: entropy
  # По умолчанию версия берётся из Cargo.toml, но её можно задать снаружи
  # (`task linux:all VERSION=0.3.2-rc.1`): релизный workflow передаёт туда имя
  # тега, чтобы имена артефактов и версии пакетов совпадали с релизом, а не с
  # ещё не поднятой версией крейта.
  VERSION:
    sh: awk -F '"' '/^version = / { print $2; exit }' Cargo.toml
  # MSI ProductVersion и CFBundleVersion принимают только числовые компоненты,
  # поэтому предрелизный суффикс туда не попадает — его несут имена файлов.
  NUMERIC_VERSION: '{{ (splitList "-" .VERSION) | first }}'
  DIST: dist
  WIN_TARGET: x86_64-pc-windows-gnu
  IMAGE: entropy-build:local
  # Загружаемые инструменты (nfpm, quill, dmg, appimagetool) живут в кэше
  # проекта, а не в системе: PATH дополняется только на время команды, и то,
  # что уже стоит у разработчика, имеет приоритет.
  TOOLS: '{{.ROOT_DIR}}/.cache/tools'
  # asdf/mise кладут в PATH shim'ы, а версию инструмента ищут по .tool-versions
  # от текущего каталога вверх. Build script крейта cargo запускает из каталога
  # реестра (~/.asdf/installs/rust/...), где .tool-versions уже не найдётся:
  # shim печатает подсказку вместо версии, и cargo-zigbuild падает на разборе
  # semver. Поэтому нужен путь к настоящему бинарнику, а не к shim'у, и
  # кандидаты проверяются из постороннего каталога, где shim заведомо не
  # резолвится.
  ZIG:
    sh: |
      # `asdf which` при неудаче печатает свою ошибку в stdout, поэтому
      # результат проверяется как путь, а не по коду возврата.
      p="$(asdf which zig 2>/dev/null)" && [ -x "$p" ] && { printf '%s\n' "$p"; exit 0; }
      for z in zig /usr/bin/zig /usr/local/bin/zig; do
        p="$(command -v "$z" 2>/dev/null)" || continue
        (cd / && "$p" version) 2>/dev/null | grep -qE '^[0-9]+\.[0-9]+' || continue
        printf '%s\n' "$p"
        exit 0
      done
      true

tasks:
  default:
    cmds:
      - task --list
    silent: true

  version:
    desc: Print the version derived from Cargo.toml
    cmds:
      - echo "{{.VERSION}}"
    silent: true

  # ---- environment --------------------------------------------------------
  prepare:
    desc: Install the build & packaging prerequisites for this host
    cmds:
      - task: 'prepare:{{OS}}'

  prepare:cross:
    desc: Same as prepare, plus the Windows/macOS cross-build toolchain
    cmds:
      - task: 'prepare:{{OS}}'
        vars: {PREPARE_ARGS: '--cross'}

  prepare:linux:
    internal: true
    cmds:
      - scripts/prepare_env.sh {{.PREPARE_ARGS}} {{.CLI_ARGS}}

  prepare:darwin:
    internal: true
    cmds:
      - scripts/prepare_env.sh {{.PREPARE_ARGS}} {{.CLI_ARGS}}

  prepare:windows:
    internal: true
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare_env.ps1 {{.CLI_ARGS}}

  clean:
    desc: Remove build/packaging artifacts
    # assets/entropy.ico и assets/entropy.icns закоммичены: .ico нужен build.rs
    # для Windows, .icns — сборке macOS на раннере, где нет чем его отрисовать.
    # Задача icons их пересоздаёт, но clean не трогает файлы под контролем git.
    cmds:
      - rm -rf {{.DIST}} target/appimage assets/icons

  # ---- assets -------------------------------------------------------------
  icons:
    desc: Generate PNG (hicolor), .ico and .icns from assets/entropy.svg
    sources:
      - assets/entropy.svg
    generates:
      - assets/icons/hicolor/256x256/apps/entropy.png
      - assets/entropy.ico
      - assets/entropy.icns
    cmds:
      - |
        set -e
        render() { # size out
          if command -v rsvg-convert >/dev/null 2>&1; then
            rsvg-convert -w "$1" -h "$1" assets/entropy.svg -o "$2"
          elif command -v inkscape >/dev/null 2>&1; then
            inkscape assets/entropy.svg -w "$1" -h "$1" -o "$2" >/dev/null 2>&1
          else
            echo "need rsvg-convert or inkscape to rasterize SVG (rsvg-convert: librsvg2-bin on Debian/Ubuntu, rsvg-convert on openSUSE, librsvg2-tools on Fedora, librsvg on Arch)" >&2
            exit 1
          fi
        }
        # ImageMagick 7 ships `magick`; ImageMagick 6 (e.g. Debian bookworm) only `convert`.
        im() {
          if command -v magick >/dev/null 2>&1; then magick "$@";
          elif command -v convert >/dev/null 2>&1; then convert "$@";
          else echo "need ImageMagick (imagemagick on Debian/Ubuntu and Arch, ImageMagick on openSUSE/Fedora) to build the .ico" >&2; exit 1; fi
        }
        for s in 16 32 48 64 128 256 512; do
          mkdir -p "assets/icons/hicolor/${s}x${s}/apps"
          render "$s" "assets/icons/hicolor/${s}x${s}/apps/entropy.png"
        done
        im \
          assets/icons/hicolor/16x16/apps/entropy.png \
          assets/icons/hicolor/32x32/apps/entropy.png \
          assets/icons/hicolor/48x48/apps/entropy.png \
          assets/icons/hicolor/64x64/apps/entropy.png \
          assets/icons/hicolor/128x128/apps/entropy.png \
          assets/icons/hicolor/256x256/apps/entropy.png \
          assets/entropy.ico
        # .icns нужен обеим macOS-сборкам: без него бандл уезжает с пустой
        # иконкой в Finder. На Linux его делает png2icns, на macOS — штатный
        # iconutil, которому нужен каталог .iconset со строгими именами файлов.
        if command -v png2icns >/dev/null 2>&1; then
          png2icns assets/entropy.icns \
            assets/icons/hicolor/16x16/apps/entropy.png \
            assets/icons/hicolor/32x32/apps/entropy.png \
            assets/icons/hicolor/128x128/apps/entropy.png \
            assets/icons/hicolor/256x256/apps/entropy.png \
            assets/icons/hicolor/512x512/apps/entropy.png
        elif command -v iconutil >/dev/null 2>&1; then
          rm -rf assets/entropy.iconset
          mkdir -p assets/entropy.iconset
          for s in 16 32 128 256 512; do
            cp "assets/icons/hicolor/${s}x${s}/apps/entropy.png" "assets/entropy.iconset/icon_${s}x${s}.png"
          done
          iconutil -c icns assets/entropy.iconset -o assets/entropy.icns
          rm -rf assets/entropy.iconset
        else
          echo "need png2icns (icnsutils on Debian/Ubuntu, icns-utils on openSUSE, libicns-utils on Fedora, libicns on Homebrew) or macOS iconutil to build the .icns" >&2
          exit 1
        fi

  # ---- native build & package (current host) ------------------------------
  build:
    desc: Release binary for the current host
    cmds:
      - cargo build --release --locked

  package:
    desc: Native package(s) for the current host OS
    cmds:
      - task: 'package:{{OS}}'

  package:linux:
    cmds:
      - task: linux:all
  package:darwin:
    cmds:
      - task: macos:all
  package:windows:
    cmds:
      - task: windows:all

  # ---- Linux targets ------------------------------------------------------
  linux:nfpm:
    internal: true
    deps: [build, icons]
    vars:
      PKG_ARCH: '{{default "amd64" .PKG_ARCH}}'
      ENTROPY_BIN: '{{default "target/release/entropy" .ENTROPY_BIN}}'
      FORMATS: '{{.FORMATS}}'
    env:
      PKG_ARCH: '{{.PKG_ARCH}}'
      VERSION: '{{.VERSION}}'
      ENTROPY_BIN: '{{.ENTROPY_BIN}}'
    cmds:
      - mkdir -p {{.DIST}}/linux
      - envsubst '$PKG_ARCH $VERSION $ENTROPY_BIN' < packaging/nfpm/nfpm.yaml.tpl > {{.DIST}}/linux/nfpm.generated.yaml
      - for: {var: FORMATS}
        cmd: PATH="$PATH:{{.TOOLS}}" nfpm package -f {{.DIST}}/linux/nfpm.generated.yaml -p {{.ITEM}} -t {{.DIST}}/linux/

  linux:deb:
    desc: Build the .deb package with nfpm
    cmds:
      - task: linux:nfpm
        vars: {FORMATS: deb}

  linux:rpm:
    desc: Build the .rpm package with nfpm
    cmds:
      - task: linux:nfpm
        vars: {FORMATS: rpm}

  linux:arch:
    desc: Build the archlinux package with nfpm
    cmds:
      - task: linux:nfpm
        vars: {FORMATS: archlinux}

  linux:pkg:
    desc: Build deb, rpm and archlinux packages
    cmds:
      - task: linux:nfpm
        vars: {FORMATS: deb rpm archlinux}

  linux:appimage:
    desc: Build a Linux AppImage
    deps: [build, icons]
    cmds:
      - mkdir -p {{.DIST}}/linux
      - scripts/build_linux_appimage.sh "v{{.VERSION}}" "{{.DIST}}/linux/{{.APP}}-v{{.VERSION}}-x86_64.AppImage"

  linux:all:
    desc: All Linux artifacts (deb/rpm/arch + AppImage)
    cmds:
      - task: linux:pkg
      - task: linux:appimage

  # ---- Windows targets (cross-built with cargo-zigbuild) ------------------
  windows:build:
    desc: Cross-build entropy.exe (x86_64-gnu) via cargo-zigbuild
    deps: [icons]
    env:
      CARGO_ZIGBUILD_ZIG_PATH: '{{default "zig" .ZIG}}'
    cmds:
      - cargo zigbuild --release --locked --target {{.WIN_TARGET}}

  windows:portable:
    desc: Portable entropy.exe
    deps: [windows:build]
    vars:
      EXE: target/{{.WIN_TARGET}}/release/entropy.exe
    cmds:
      - mkdir -p {{.DIST}}/windows
      - cp {{.EXE}} {{.DIST}}/windows/{{.APP}}-v{{.VERSION}}-windows-x86_64.exe

  windows:msi:
    desc: MSI installer (wixl)
    deps: [windows:build, icons]
    vars:
      EXE: target/{{.WIN_TARGET}}/release/entropy.exe
    cmds:
      - mkdir -p {{.DIST}}/windows
      - wixl -a x64 -D Version={{.NUMERIC_VERSION}} -D ExeSource={{.EXE}} -o {{.DIST}}/windows/{{.APP}}-v{{.VERSION}}-x64.msi packaging/windows/entropy.wxs

  windows:all:
    desc: Portable exe + MSI installer
    cmds:
      - task: windows:portable
      - task: windows:msi

  # ---- macOS targets ------------------------------------------------------
  # Native path (real signing + .dmg): run on a Mac. Both slices are merged with
  # lipo, so the result is one universal bundle.
  macos:app:
    desc: "Universal macOS .app + .dmg (run on macOS)"
    env:
      VERSION: '{{.VERSION}}'
    cmds:
      - scripts/build_macos_app.sh

  macos:all:
    desc: "macOS artifacts (run on macOS)"
    cmds:
      - task: macos:app

  macos:cross:
    desc: "Universal macOS .app + .dmg cross-built from Linux (zig+SDK+quill)"
    deps: [icons]
    env:
      CARGO_ZIGBUILD_ZIG_PATH: '{{default "zig" .ZIG}}'
      VERSION: '{{.VERSION}}'
    cmds:
      - scripts/build_macos_cross.sh

  macos:prepare-sdk:
    desc: Download the pinned macOS SDK into .cache (for the cross-build)
    cmds:
      - scripts/prepare_macos_sdk.sh

  # ---- reproducible cross-build via Docker --------------------------------
  docker:image:
    desc: Build the local cross-build toolchain image
    # В CI образ собирается отдельным шагом ради кэша слоёв (внутри него
    # компилируются cargo-zigbuild и libdmg-hfsplus), и повторная сборка здесь
    # его бы только продублировала: DOCKER_IMAGE_READY=1 её выключает.
    status:
      - test -n "$DOCKER_IMAGE_READY"
    cmds:
      - docker build -t {{.IMAGE}} .

  docker:run:
    internal: true
    vars:
      UID: {sh: id -u}
      GID: {sh: id -g}
      # На SELinux-системах (openSUSE, Fedora) каталог репозитория помечен
      # user_home_t, и контейнеру в домене container_t чтение запрещено. Метка
      # снимается только на время запуска: ':z' вместо этого рекурсивно
      # перемаркировал бы всё дерево, включая target и .git.
      SELINUX:
        sh: 'command -v getenforce >/dev/null 2>&1 && [ "$(getenforce)" != Disabled ] && echo --security-opt label=disable || true'
    cmds:
      - >
        docker run --rm {{.SELINUX}}
        -e HOST_UID={{.UID}} -e HOST_GID={{.GID}}
        -v "$PWD":/work -w /work {{.IMAGE}}
        sh -c 'task {{.TASKS}} VERSION={{.VERSION}}; rc=$?; chown -R "$HOST_UID:$HOST_GID" {{.DIST}} target .task .intentionally-empty-file.o 2>/dev/null || true; exit $rc'

  docker:linux:
    desc: Linux artifacts (deb/rpm/arch + AppImage) from the toolchain container
    deps: [docker:image]
    cmds:
      - task: docker:run
        vars: {TASKS: linux:all}

  docker:windows:
    desc: Windows artifacts (portable exe + MSI) from the toolchain container
    deps: [docker:image]
    cmds:
      - task: docker:run
        vars: {TASKS: windows:all}

  docker:dist:
    desc: Linux + Windows artifacts from the toolchain container
    deps: [docker:image]
    cmds:
      - task: docker:run
        vars: {TASKS: linux:all windows:all}

  docker:macos-cross:
    desc: "Cross-build the macOS .app + .dmg inside the container"
    deps: [docker:image]
    cmds:
      - task: docker:run
        vars: {TASKS: macos:cross}
