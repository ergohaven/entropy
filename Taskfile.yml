# https://taskfile.dev
#
# Unified cross-platform build & packaging for Entropy.
#   task build            - release binary for the host
#   task package          - packages for the host OS (Linux: deb/rpm/arch/AppImage)
#   task release          - everything reachable from the current host
#   task docker:release   - Linux + Windows packages from a throwaway container
#
# macOS is built on a real Mac (hybrid): `task package:macos` there.
version: '3'

vars:
  APP: entropy
  VERSION:
    sh: awk -F '"' '/^version = / { print $2; exit }' Cargo.toml
  DIST: dist
  WIN_TARGET: x86_64-pc-windows-gnu
  IMAGE: entropy-build:local

tasks:
  default:
    cmds:
      - task --list
    silent: true

  version:
    desc: Print the version derived from Cargo.toml
    cmds:
      - echo "{{.VERSION}}"
    silent: true

  clean:
    desc: Remove build/packaging artifacts
    cmds:
      - rm -rf {{.DIST}} target/appimage assets/icons

  # ---- assets -------------------------------------------------------------
  icons:
    desc: Generate PNG (hicolor), .ico and .icns from assets/entropy.svg
    sources:
      - assets/entropy.svg
    generates:
      - assets/icons/hicolor/256x256/apps/entropy.png
    cmds:
      - |
        set -e
        render() { # size out
          if command -v rsvg-convert >/dev/null 2>&1; then
            rsvg-convert -w "$1" -h "$1" assets/entropy.svg -o "$2"
          elif command -v inkscape >/dev/null 2>&1; then
            inkscape assets/entropy.svg -w "$1" -h "$1" -o "$2" >/dev/null 2>&1
          else
            echo "need rsvg-convert (librsvg2-bin / librsvg-tools) or inkscape to rasterize SVG" >&2
            exit 1
          fi
        }
        for s in 16 32 48 64 128 256 512; do
          mkdir -p "assets/icons/hicolor/${s}x${s}/apps"
          render "$s" "assets/icons/hicolor/${s}x${s}/apps/entropy.png"
        done
        magick \
          assets/icons/hicolor/16x16/apps/entropy.png \
          assets/icons/hicolor/32x32/apps/entropy.png \
          assets/icons/hicolor/48x48/apps/entropy.png \
          assets/icons/hicolor/64x64/apps/entropy.png \
          assets/icons/hicolor/128x128/apps/entropy.png \
          assets/icons/hicolor/256x256/apps/entropy.png \
          assets/entropy.ico
        if command -v png2icns >/dev/null 2>&1; then
          png2icns assets/entropy.icns \
            assets/icons/hicolor/16x16/apps/entropy.png \
            assets/icons/hicolor/32x32/apps/entropy.png \
            assets/icons/hicolor/128x128/apps/entropy.png \
            assets/icons/hicolor/256x256/apps/entropy.png \
            assets/icons/hicolor/512x512/apps/entropy.png
        else
          echo "png2icns not found (icnsutils); skipping .icns (build it on macOS or in the container)" >&2
        fi

  # ---- build --------------------------------------------------------------
  build:
    desc: Release binary for the host platform
    cmds:
      - cargo build --release --locked

  build:windows:
    desc: Cross-build entropy.exe for Windows (x86_64-gnu) via cargo-zigbuild
    cmds:
      - cargo zigbuild --release --locked --target {{.WIN_TARGET}}

  # ---- Linux packaging ----------------------------------------------------
  package:linux:
    desc: Build deb, rpm and archlinux packages with nfpm
    deps: [build, icons]
    vars:
      PKG_ARCH: '{{default "amd64" .PKG_ARCH}}'
      ENTROPY_BIN: '{{default "target/release/entropy" .ENTROPY_BIN}}'
      FORMATS: deb rpm archlinux
    env:
      PKG_ARCH: '{{.PKG_ARCH}}'
      VERSION: '{{.VERSION}}'
      ENTROPY_BIN: '{{.ENTROPY_BIN}}'
    cmds:
      - mkdir -p {{.DIST}}/linux
      - envsubst '$PKG_ARCH $VERSION $ENTROPY_BIN' < packaging/nfpm/nfpm.yaml.tpl > {{.DIST}}/linux/nfpm.generated.yaml
      - for: {var: FORMATS}
        cmd: nfpm package -f {{.DIST}}/linux/nfpm.generated.yaml -p {{.ITEM}} -t {{.DIST}}/linux/

  package:appimage:
    desc: Build a Linux AppImage
    deps: [build]
    cmds:
      - scripts/build_linux_appimage.sh "v{{.VERSION}}" "{{.DIST}}/linux/{{.APP}}-v{{.VERSION}}-x86_64.AppImage"

  # ---- Windows packaging --------------------------------------------------
  package:windows:
    desc: Build portable exe, MSI (wixl) and NSIS installer
    deps: [build:windows, icons]
    vars:
      EXE: target/{{.WIN_TARGET}}/release/entropy.exe
    cmds:
      - mkdir -p {{.DIST}}/windows
      - cp {{.EXE}} {{.DIST}}/windows/{{.APP}}-v{{.VERSION}}-windows-x86_64.exe
      - wixl -a x64 -D Version={{.VERSION}} -D ExeSource={{.EXE}} -o {{.DIST}}/windows/{{.APP}}-v{{.VERSION}}-x64.msi packaging/windows/entropy.wxs
      - makensis -DVERSION={{.VERSION}} -DEXE_SOURCE={{.ROOT_DIR}}/{{.EXE}} -DICON={{.ROOT_DIR}}/assets/entropy.ico -DLICENSE_FILE={{.ROOT_DIR}}/LICENSE -DOUTFILE={{.ROOT_DIR}}/{{.DIST}}/windows/{{.APP}}-setup-v{{.VERSION}}.exe packaging/windows/entropy.nsi

  # ---- macOS packaging (run on a Mac) -------------------------------------
  prepare:macos-sdk:
    desc: Download the pinned macOS SDK into .cache (for the experimental cross-build)
    cmds:
      - scripts/prepare_macos_sdk.sh

  package:macos:
    desc: Build the macOS .app bundle and .dmg (run on macOS)
    cmds:
      - scripts/build_macos_app.sh

  # Alias so `task package` resolves on macOS ({{OS}} == "darwin").
  package:darwin:
    cmds:
      - task: package:macos

  package:macos-cross:
    desc: "EXPERIMENTAL: macOS universal .app + .dmg cross-built from Linux (zig+SDK+quill)"
    deps: [icons]
    cmds:
      - scripts/build_macos_cross.sh

  # ---- aggregates ---------------------------------------------------------
  package:
    desc: Package for the current host OS
    cmds:
      - task: 'package:{{OS}}'

  package:linux:all:
    cmds:
      - task: package:linux
      - task: package:appimage

  release:
    desc: All artifacts reachable from this host (Linux+Windows on Linux; macOS on Mac)
    cmds:
      - task: 'release:{{OS}}'

  release:linux:
    cmds:
      - task: package:linux
      - task: package:appimage
      - task: package:windows

  release:darwin:
    cmds:
      - task: package:macos

  release:windows:
    cmds:
      - task: package:windows

  # ---- containerized build ------------------------------------------------
  docker:image:
    desc: Build the local cross-build toolchain image
    cmds:
      - docker build -f Dockerfile.build -t {{.IMAGE}} .

  docker:release:
    desc: Build Linux + Windows packages inside the toolchain container
    deps: [docker:image]
    cmds:
      - docker run --rm -v "$PWD":/work -w /work {{.IMAGE}} task release:linux

  docker:macos-cross:
    desc: "EXPERIMENTAL: cross-build the macOS .app + .dmg inside the container"
    deps: [docker:image]
    cmds:
      - docker run --rm -v "$PWD":/work -w /work {{.IMAGE}} task package:macos-cross

  docker:release-all:
    desc: "EXPERIMENTAL: Linux + Windows + macOS(cross) inside the container"
    deps: [docker:image]
    cmds:
      - docker run --rm -v "$PWD":/work -w /work {{.IMAGE}} sh -c "task release:linux && task package:macos-cross"
